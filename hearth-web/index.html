<!DOCTYPE html>
<!--
  Hearth. The playing strip (black, vignette, grain, fades) and the state machine
  are adapted from Dream Recorder by Modem (github.com/modem-works/dream-recorder, MIT).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hearth</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fallback only: the bundled fonts in fonts/ come first in the stack. Non-blocking so an offline Hearth still renders. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div id="hearth" data-state="boot">
    <main class="strip" id="strip">
      <div class="layer media" id="media" data-kind="warm">
        <div class="warm"></div>
        <div class="kb"><img id="img-a" alt=""><img id="img-b" alt=""></div>
        <video id="video" muted loop playsinline preload="auto"></video>
        <div class="film-vignette"></div>
      </div>

      <div class="layer clock" id="clock" aria-live="off">
        <b class="day-num" id="day-num"></b>
        <div class="day-wd"><span id="day-wd"></span><span class="day-mo" id="day-mo"></span></div>
        <div class="clk"><span id="clock-h">0</span><span class="colon" id="clock-colon">:</span><span id="clock-m">00</span></div>
      </div>

      <div class="layer col waiting">
        <span class="label" id="waiting-label"></span>
        <h1 class="headline" id="waiting-line"></h1>
        <p class="sub" id="waiting-sub"></p>
      </div>

      <div class="layer rec" id="rec">
        <div class="rec-text">
          <h1 class="headline">Te escucho</h1>
          <p class="sub" id="rec-prompt"></p>
        </div>
        <div class="rec-side">
          <span class="rec-label">REC</span>
          <span class="counter" aria-hidden="true"><i id="c0">0</i><i id="c1">0</i><s>:</s><i id="c2">0</i><i id="c3">0</i></span>
        </div>
      </div>

      <div class="layer col send" id="send">
        <h1 class="headline" id="send-line"></h1>
        <p class="sub" id="send-sub"></p>
      </div>

      <p class="layer play-stamp" id="play-stamp"></p>
      <p class="layer play-cap" id="play-cap"></p>

      <div class="layer col err">
        <span class="label">un momento</span>
        <h1 class="headline" id="err-line"></h1>
      </div>

      <p class="status" id="status"></p>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </main>

    <div class="spot" id="spot" aria-hidden="true"><div class="glow"></div><div class="glow-breathe"><div class="glow"></div></div></div>
  </div>

  <audio id="audio" preload="auto"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
