name: MotherTongue
options:
  bundleIdPrefix: com.hacktx
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.0
targets:
  MotherTongue:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MotherTongue
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hacktx.mothertongue
        PRODUCT_NAME: MotherTongue
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: DV483F72N3
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MotherTongue/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kinn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSMicrophoneUsageDescription: Kinn records your voice so your family can hear your messages, translated, in your own voice.
        UILaunchScreen:
          UIColorName: Paper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-Light.ttf
  MotherTongueUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MotherTongueUITests
    dependencies:
      - target: MotherTongue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hacktx.mothertongue.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MotherTongue
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DV483F72N3
schemes:
  MotherTongue:
    build:
      targets:
        MotherTongue: all
        MotherTongueUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MotherTongueUITests
